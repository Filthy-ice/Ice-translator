[workspace]
resolver = "3"
members = ["crates/ice-core", "crates/ice-providers", "crates/ice-vision", "crates/ice-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Filthy-ice/Ice-translator"

[workspace.dependencies]
ice-core = { path = "crates/ice-core" }
ice-providers = { path = "crates/ice-providers" }
ice-vision = { path = "crates/ice-vision" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
dirs = "7.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3.7"
keyring = "4.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
