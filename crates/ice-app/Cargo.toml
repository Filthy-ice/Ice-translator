[package]
name = "ice-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ice Translator 桌面客户端：全量界面与简洁悬浮双模式。"

[[bin]]
name = "ice-translator"
path = "src/main.rs"

[dependencies]
ice-core.workspace = true
ice-providers.workspace = true
ice-vision.workspace = true
eframe = "0.37"
egui = "0.37"
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
image.workspace = true
arboard.workspace = true
# 应用是装配根：Key 从钥匙串读出后直接交给 AiEngine，引擎层自己不碰钥匙串（ADR-005）
keyring.workspace = true
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
# 单实例锁用 kill(pid, 0) 判定 PID 存活；macOS 没有 /proc（REQ-009）
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# 屏幕可用区（去掉菜单栏与 Dock 的那块）只能问 AppKit：egui 的 `ViewportInfo` 只有
# `monitor_size`（整块屏幕），winit 的 `MonitorHandle` 也没有 work area（CHG-004 REQ-003）。
# 三个 crate 都已由 arboard/eframe/winit 传递引入并锁在 Cargo.lock 里。
#
# `default-features = false` 是必须的：objc2-app-kit 的 default 会打开 ~283 个模块，
# 连带把 objc2-cloud-kit / core-video / core-text / metal 等六个 Apple 绑定 crate 拖进
# 编译图（实测：不设它，`cargo build` 会多出这六个 rlib）。这里只需要读 `NSScreen`，
# 外加 `NSView`/`NSWindow` 两个模块——失焦半透明要改整窗不透明度（FR-3.7，见 `system::alpha`）；
# 再加 `NSButton`/`NSControl` 两个模块——标题栏绿键的 target-action 挂在 NSButton 上，
# 而 `standardWindowButton:` 的返回类型、`setTarget:`/`setAction:` 分别要这两个模块才存在
# （`NSWindow.rs:1642` 的 cfg 就是这两个 + `NSView`）。
# 还要 `NSEvent`——原生拖拽期间 egui 拿不到鼠标抬起，松手判定只能问 `+pressedMouseButtons`
# 这个窗口服务器维护的按键掩码（缺陷 D-16，见 `system::mouse`）。
# 标题栏图钉（FR-3.4，变更 I，见 `system::pin`）再加九个模块，都是那颗按钮要的类型：
# `NSTitlebarAccessoryViewController` 是"既在标题栏里、又收得到点击"的唯一公开位置
# （`fullSizeContentView` 里画上去的控件会被 `NSTitlebarView` 自己的 `mouseDown` 吞掉），
# `NSViewController`/`NSResponder` 是它的父类链——不打开就调不到 `setView:`；
# `NSLayoutConstraint` 只为了取 `NSLayoutAttribute::Right` 这一个枚举值；
# `NSImage` + `NSGraphics` 是 SF Symbol `pin` 与"转 45° 立起来"那步（`NSCompositingOperation`）；
# `NSCell` 是 `NSCellImagePosition::ImageOnly`；`NSColor` 是 `contentTintColor` 那支系统蓝。
# `objc2-core-foundation` 不是可选项：`NSWindow::setAlphaValue:` 的参数类型是 `CGFloat`，
# objc2-app-kit 把带 CGFloat 的方法整体关在这个 feature 后面，不开就连方法都看不到。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSTitlebarAccessoryViewController",
    "NSViewController",
    "NSResponder",
    "NSImage",
    "NSGraphics",
    "NSColor",
    "NSCell",
    "NSLayoutConstraint",
    "NSAffineTransform",
    "objc2-core-foundation",
] }
# `NSObject` 是运行时那两个改道 target 的父类（绿键一个、图钉一个），`NSString` 是悬停提示文案；
# `NSGeometry` 是 `NSRect/NSPoint/NSSize` 这组别名；`NSAffineTransform` 是图钉转角度用的
# `translateXBy_yBy:`/`rotateByDegrees:`（`concat` 那半在 app-kit 的同名 feature 里）；
# `NSArray` 是 `NSImage::representations()` 的返回类型——画完得问它"这张真画出内容了吗"。
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSAffineTransform",
    "NSArray",
] }
# 从 eframe 拿到原生窗口句柄：`AppKitWindowHandle.ns_view` 指的是 NSView（不是窗口），
# 再问它要 `window`。只取句柄，不引 winit 本身。
raw-window-handle = "0.6"
