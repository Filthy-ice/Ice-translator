[package]
name = "ice-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ice Translator 桌面客户端：全量界面与简洁悬浮双模式。"

[[bin]]
name = "ice-translator"
path = "src/main.rs"

[dependencies]
ice-core.workspace = true
ice-providers.workspace = true
ice-vision.workspace = true
eframe = "0.37"
egui = "0.37"
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
image.workspace = true
arboard.workspace = true
# 应用是装配根：Key 从钥匙串读出后直接交给 AiEngine，引擎层自己不碰钥匙串（ADR-005）
keyring.workspace = true
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
# 单实例锁用 kill(pid, 0) 判定 PID 存活；macOS 没有 /proc（REQ-009）
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# P5 若 egui 的 WindowLevel 不足以实现置顶，再引入 AppKit 绑定：
# [target.'cfg(target_os = "macos")'.dependencies]
# objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication"] }
