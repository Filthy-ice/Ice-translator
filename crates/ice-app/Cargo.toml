[package]
name = "ice-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ice Translator 桌面客户端：全量界面与简洁悬浮双模式。"

[[bin]]
name = "ice-translator"
path = "src/main.rs"

[dependencies]
ice-core.workspace = true
ice-providers.workspace = true
ice-vision.workspace = true
eframe = "0.37"
egui = "0.37"
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
image.workspace = true
arboard.workspace = true
# 应用是装配根：Key 从钥匙串读出后直接交给 AiEngine，引擎层自己不碰钥匙串（ADR-005）
keyring.workspace = true
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
# 单实例锁用 kill(pid, 0) 判定 PID 存活；macOS 没有 /proc（REQ-009）
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# 屏幕可用区（去掉菜单栏与 Dock 的那块）只能问 AppKit：egui 的 `ViewportInfo` 只有
# `monitor_size`（整块屏幕），winit 的 `MonitorHandle` 也没有 work area（CHG-004 REQ-003）。
# 三个 crate 都已由 arboard/eframe/winit 传递引入并锁在 Cargo.lock 里。
#
# `default-features = false` 是必须的：objc2-app-kit 的 default 会打开 ~283 个模块，
# 连带把 objc2-cloud-kit / core-video / core-text / metal 等六个 Apple 绑定 crate 拖进
# 编译图（实测：不设它，`cargo build` 会多出这六个 rlib）。这里只需要读 `NSScreen`，
# 外加 `NSView`/`NSWindow` 两个模块——失焦半透明要改整窗不透明度（FR-3.7，见 `system::alpha`）；
# 再加 `NSButton`/`NSControl` 两个模块——标题栏绿键的 target-action 挂在 NSButton 上，
# 而 `standardWindowButton:` 的返回类型、`setTarget:`/`setAction:` 分别要这两个模块才存在
# （`NSWindow.rs:1642` 的 cfg 就是这两个 + `NSView`）。
# 还要 `NSEvent`——原生拖拽期间 egui 拿不到鼠标抬起，松手判定只能问 `+pressedMouseButtons`
# 这个窗口服务器维护的按键掩码（缺陷 D-16，见 `system::mouse`）。
# 标题栏图钉（FR-3.4）曾经为那颗按钮多开九个模块（accessory VC + 父类链 + SF Symbol 重画 +
# tint 上色）。2026-10-29 变更 K 把图钉挪进界面由 egui 现画，那九个连同 `system::pin` 一起删除：
# accessory VC 只能钉在标题栏最右端，满足不了用户指定的两个位置（全量窗「悬浮窗」左边、
# 简洁窗滑块左边）。这一串因此回到"读屏幕 + 改窗口 + 接按钮 + 听事件"四件事所需的最小集合。
# `objc2-core-foundation` 不是可选项：`NSWindow::setAlphaValue:` 的参数类型是 `CGFloat`，
# objc2-app-kit 把带 CGFloat 的方法整体关在这个 feature 后面，不开就连方法都看不到。
# 再加一个 `block2` feature（**不是模块名，是那条特性**）：双击标题栏（任务 #25，见
# `system::dblclick`）唯一能"既看到又拦下"的位置是 `+addLocalMonitorForEventsMatchingMask:handler:`，
# 而它接的是 ObjC block——`NSEvent.rs:1174` 那条重载整个 `#[cfg(feature = "block2")]`，
# 不开就只剩一个收 `DynBlock` 之外的版本都没有，方法直接看不到。
objc2 = "0.6"
block2 = "0.6"
# 图片页的"打开图片"（CHG-005 Q-002：自接 `NSOpenPanel`，不引 `rfd`）再加四个模块，
# 每一个都是编译面证据，不是照着清单凑数：
# - `NSOpenPanel`/`NSSavePanel`：面板本体，`URL()`/`URLs()` 挂在 `NSSavePanel` 上，
#   `openPanel(mtm)` 挂在 `NSOpenPanel` 上，两个都得开；
# - `NSPanel`：`NSOpenPanel : NSSavePanel : NSPanel : NSWindow` 这条父类链中间那一环，
#   关掉它 `objc2-app-kit` 生成的 `Deref`/`parent` 就指向一个不存在的类型；
# - `NSApplication`：`beginWithCompletionHandler:` 整个方法 `#[cfg(all(feature = "NSApplication",
#   feature = "block2"))]`（`NSSavePanel.rs:421`），回调参数 `NSModalResponse` 那几个常量也
#   锁在它里面（`NSWindow.rs:69`）。不开就没有异步入口，只剩被禁的 `runModal`。
# 它只多打开 objc2-foundation 已有 crate 的模块（NSArray/NSData/NSDate/…），不新增 crate 名。
#
# CHG-008 的菜单栏托盘（FR-5.4）再加八个模块 + 一个 foundation 模块，同样逐个给编译面证据：
# - `NSStatusBar`：`systemStatusBar()` 与 `statusItemWithLength:` 的家（`NSStatusBar.rs:32-39`）；
# - `NSStatusItem`：状态项本体，`statusItemWithLength:` 的返回类型、`setMenu:`、`button()` 都在里面
#   （`NSStatusItem.rs:36-86`）；
# - `NSStatusBarButton` + `NSResponder`：`button()` 那条 cfg 明列这两个（`NSStatusItem.rs:76-86`），
#   后者是 `NSStatusBarButton : NSButton : NSControl : NSView : NSResponder` 父类链的最后一环，
#   缺它生成的 `Deref` 指向不存在的类型——左/右键接线要拿到那枚按钮，就绕不开这一对；
# - `NSMenu` + `NSMenuItem`：`setMenu:`/`menu()` 的门，加上 `NSMenu::new(mtm)`/`addItem:` 与
#   `NSMenuItem::initWithTitle_action_keyEquivalent:`（`NSMenu.rs:204-466`、`NSMenuItem.rs:84-94`）；
# - `NSImage`：`NSButton::setImage:` 整个方法 `#[cfg(feature = "NSImage")]`（`NSButton.rs:446-450`），
#   `initWithData:` 与 `setTemplate:` 也住在它里面（`NSImage.rs:192/442`）；
# - `NSRunningApplication`：**最容易漏的一个**。"关窗后 Dock 磁贴消失"这件事的方法
#   `setActivationPolicy:` 整体 `#[cfg(feature = "NSRunningApplication")]`（`NSApplication.rs:746-755`），
#   三个策略常量（Regular/Accessory/Prohibited）也定义在 `NSRunningApplication.rs:47-56` 里。
#   不开它，代码不是"设置没生效"，是**方法根本看不见**；
# - foundation 侧的 `NSData`：`NSImage::initWithData:` 的参数类型。
# 这九个开关一个 crate 名都不新增。判据看 `cargo tree -p ice-app -e normal` 里
# **objc2-app-kit 自己那一节**（2026-11-04 实测，20 个 feature 全开后只剩五个子依赖：
# bitflags / block2 / objc2 / objc2-core-foundation / objc2-core-graphics / objc2-foundation）：
# 它下面 SHALL NOT 出现 objc2-cloud-kit / core-video / core-media / image-io —— 开了 default
# 才会多出这六个 rlib。（`core-text` 与 `objc2-metal` 整棵树里各有一处，来源是 eframe 自己的
# 字体提供器与渲染后端，与本 crate 的 feature 无关，所以不能拿它们当判据。）
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSOpenPanel",
    "NSSavePanel",
    "NSPanel",
    "NSApplication",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSResponder",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSRunningApplication",
    "block2",
    "objc2-core-foundation",
] }
# `NSString` 是悬停提示文案；`NSURL`/`NSArray` 是面板回调里把路径交回帧循环的那两步
# （`NSSavePanel::URL() -> Option<Retained<NSURL>>`、`NSOpenPanel::URLs()` 的返回类型住在它们里面）。
# `NSObject` 是标题栏绿键那颗改道 target 的父类（`system::titlebar` 的 `define_class!`）。
# `NSGeometry` 是 `NSRect/NSPoint/NSSize` 这组别名。
# `NSData` 是托盘那张位图交给 `NSImage::initWithData:` 的那一步（`system::tray`）。
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "NSArray",
    "NSData",
] }
# 从 eframe 拿到原生窗口句柄：`AppKitWindowHandle.ns_view` 指的是 NSView（不是窗口），
# 再问它要 `window`。只取句柄，不引 winit 本身。
raw-window-handle = "0.6"
